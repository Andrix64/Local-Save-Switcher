<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aggiungi un gioco</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8076;text-decoration:none}a:hover{color:#FFB4AD}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #070708; color: #F2F2F2; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-labelledby="add-title" style="width: 620px; box-sizing: border-box; padding: 36px; border-radius: 20px; background: #19191B; border: 1px solid #2E2E33; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 id="add-title" style="margin: 0; font-size: 28px; font-weight: 800">Aggiungi un gioco</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A8A8AE">Per qualsiasi gioco del computer: senza launcher, di un altro launcher, un emulatore.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="exe" style="font-size: 14px; font-weight: 700; color: #D6D6DA">Programma del gioco <span style="font-weight: 500; color: #96969C">(facoltativo)</span></label>
      <div style="display: flex; gap: 10px; align-items: center">
        <div style="width: 52px; height: 52px; flex: none; border-radius: 10px; background: #2F5D2F; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800" aria-hidden="true">M</div>
        <input id="exe" value="D:\Giochi\Minecraft\MinecraftLauncher.exe" readonly style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3A40; background: #0F0F10; color: #F2F2F2; font-family: 'JetBrains Mono', monospace; font-size: 13px">
        <button style="height: 48px; padding: 0 16px; border-radius: 10px; border: 0; background: #2C2C30; color: #F2F2F2; font-family: inherit; font-size: 15px; font-weight: 600">Sfoglia…</button>
      </div>
      <span style="font-size: 13px; color: #96969C">Serve per avviarlo da LSS e per capire quando è aperto. L'icona viene presa da qui.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" style="font-size: 14px; font-weight: 700; color: #D6D6DA">Nome</label>
      <input id="name" value="Minecraft" readonly style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #E0261B; background: #0F0F10; color: #F2F2F2; font-family: inherit; font-size: 16px">
    </div>
    <details style="border-radius: 10px; background: #0F0F10; border: 1px solid #2E2E33; padding: 12px 14px">
      <summary style="font-size: 14px; font-weight: 700; color: #D6D6DA; cursor: pointer">Altro (solo Linux)</summary>
      <div style="display: flex; gap: 10px; align-items: center; margin-top: 12px">
        <label for="prefix" style="font-size: 14px; color: #A8A8AE; flex: none">Cartella Wine / Proton</label>
        <input id="prefix" placeholder="facoltativa" readonly style="flex: 1; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #3A3A40; background: #19191B; color: #F2F2F2; font-family: inherit">
        <button style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #2C2C30; color: #F2F2F2; font-family: inherit; font-weight: 600">Sfoglia…</button>
      </div>
    </details>
    <div style="display: flex; gap: 12px; justify-content: flex-end">
      <button style="height: 52px; padding: 0 22px; border-radius: 12px; border: 0; background: transparent; color: #A8A8AE; font-family: inherit; font-size: 17px; font-weight: 600">Annulla</button>
      <button style="height: 52px; padding: 0 26px; border-radius: 12px; border: 0; background: #E0261B; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Aggiungi e trova i salvataggi</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
