<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Giocatori</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8076;text-decoration:none}a:hover{color:#FFB4AD}
</style>
</helmet>
<div style="width: 1200px; height: 780px; box-sizing: border-box; background: #070708; color: #F2F2F2; font-family: Inter, system-ui, sans-serif; font-size: 13px; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-labelledby="pl-title" style="width: 760px; box-sizing: border-box; padding: 24px 28px; border-radius: 12px; background: #0F0F10; border: 1px solid #2E2E33; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 id="pl-title" style="margin: 0; font-size: 19px; font-weight: 700">Giocatori</h1>
      <button style="height: 32px; padding: 0 14px; border-radius: 6px; border: 0; background: #E0261B; color: #FFFFFF; font-family: inherit; font-weight: 700">+ Aggiungi giocatore</button>
    </div>
    <p style="margin: 0; color: #A8A8AE; font-size: 13px; line-height: 1.5">Gli admin possono aprire la modalità avanzata, aggiungere giocatori e giochi e consentire i giochi con i salvataggi nel cloud. Il PIN è facoltativo.</p>
    <div role="table" aria-label="Giocatori" style="display: flex; flex-direction: column; border-radius: 8px; border: 1px solid #2E2E33; overflow: hidden">
      <div role="row" style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 90px 130px 120px 40px; gap: 12px; align-items: center; padding: 8px 14px; background: #19191B; font-size: 11px; font-weight: 700; color: #96969C; letter-spacing: 0.5px">
        <span></span><span role="columnheader">NOME</span><span role="columnheader">ADMIN</span><span role="columnheader">PIN</span><span role="columnheader">COLORE</span><span></span>
      </div>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <div role="row" style="display: grid; grid-template-columns: 34px minmax(0, 1fr) 90px 130px 120px 40px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid #2E2E33">
          <div style="width: 30px; height: 30px; border-radius: 15px; background: {{p.color}}; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #FFFFFF">{{p.initial}}</div>
          <span style="font-size: 14px; font-weight: 600">{{p.name}}</span>
          <label style="display: flex; align-items: center; gap: 6px; color: {{p.adminText}}" title="{{p.adminTip}}">
            <span style="width: 18px; height: 18px; border-radius: 4px; box-sizing: border-box; background: {{p.adminBox}}; border: 2px solid {{p.adminBorder}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px; font-weight: 800" aria-hidden="true">{{p.adminMark}}</span>
            <span>{{p.adminLabel}}</span>
          </label>
          <span><sc-if value="{{p.isAdmin}}" hint-placeholder-val="{{true}}"><a href="SetPin.dc.html" style="font-weight: 600">{{p.pinAction}}</a></sc-if></span>
          <span style="display: flex; gap: 4px" aria-label="Colore">
            <span style="width: 18px; height: 18px; border-radius: 9px; background: {{p.color}}; outline: 2px solid #F2F2F2; outline-offset: 1px"></span>
            <span style="width: 18px; height: 18px; border-radius: 9px; background: #6D3FB0"></span>
            <span style="width: 18px; height: 18px; border-radius: 9px; background: #8A6A12"></span>
          </span>
          <button aria-label="Altre azioni" style="height: 28px; width: 36px; border-radius: 6px; border: 0; background: #2C2C30; color: #F2F2F2; font-family: inherit; font-weight: 700">···</button>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 16px; font-size: 12px; color: #96969C">
      <span>Menu ···: Rinomina · Sposta su / giù · Rimuovi…</span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <a href="RemovePlayer.dc.html" style="height: 34px; display: flex; align-items: center; padding: 0 14px; border-radius: 6px; background: #2C2C30; color: #F2F2F2; font-weight: 600">Rimuovi Luca…</a>
      <button style="height: 34px; padding: 0 18px; border-radius: 6px; border: 0; background: #E0261B; color: #FFFFFF; font-family: inherit; font-weight: 700">Chiudi</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, color, admin, pin, last) => ({
      name, color, initial: name.charAt(0), isAdmin: admin,
      adminBox: admin ? (last ? '#7A2A24' : '#E0261B') : 'transparent', adminBorder: admin ? (last ? '#7A2A24' : '#E0261B') : '#5A5A60',
      adminMark: admin ? '✓' : '', adminLabel: admin ? 'Admin' : 'Utente', adminText: last ? '#96969C' : '#F2F2F2',
      adminTip: last ? 'Deve esserci almeno un admin.' : '',
      pinAction: pin ? 'Cambia PIN…' : 'Imposta PIN…'
    });
    return {
      people: [
        p('Andrea', '#C2410C', true, true, false),
        p('Mamma', '#6D3FB0', true, false, false),
        p('Clara', '#1D6FD0', false, false, false),
        p('Luca', '#2F7D3B', false, false, false)
      ]
    };
  }
}
</script>
</body>
</html>
