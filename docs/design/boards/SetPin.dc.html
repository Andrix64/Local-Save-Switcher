<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Imposta il PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8076;text-decoration:none}a:hover{color:#FFB4AD}
</style>
</helmet>
<div style="width: 1200px; height: 780px; box-sizing: border-box; background: #070708; color: #F2F2F2; font-family: Inter, system-ui, sans-serif; font-size: 13px; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-labelledby="pin-title" style="width: 460px; box-sizing: border-box; padding: 24px 28px; border-radius: 12px; background: #0F0F10; border: 1px solid #2E2E33; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #6D3FB0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">M</div>
      <h1 id="pin-title" style="margin: 0; font-size: 19px; font-weight: 700">PIN di Mamma</h1>
    </div>
    <p style="margin: 0; color: #A8A8AE; line-height: 1.5">Facoltativo. Con un PIN, solo tu puoi usare i permessi di admin. Se lo dimentichi, un altro admin può toglierlo.</p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pin-new" style="font-size: 12px; font-weight: 700; color: #A8A8AE">Nuovo PIN</label>
      <input id="pin-new" type="password" value="1234" readonly inputmode="numeric" maxlength="4" style="width: 160px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 6px; border: 1px solid #3A3A40; background: #19191B; color: #F2F2F2; font-family: inherit; font-size: 22px; letter-spacing: 10px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pin-again" style="font-size: 12px; font-weight: 700; color: #A8A8AE">Ripeti il nuovo PIN</label>
      <input id="pin-again" type="password" value="12" readonly inputmode="numeric" maxlength="4" style="width: 160px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 6px; border: 1px solid #E0261B; background: #19191B; color: #F2F2F2; font-family: inherit; font-size: 22px; letter-spacing: 10px">
      <span style="font-size: 12px; color: #A8A8AE">4 cifre</span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button style="height: 34px; padding: 0 16px; border-radius: 6px; border: 0; background: #2C2C30; color: #F2F2F2; font-family: inherit; font-weight: 600">Annulla</button>
      <button disabled style="height: 34px; padding: 0 18px; border-radius: 6px; border: 0; background: #5A2420; color: #C9A3A0; font-family: inherit; font-weight: 700">Salva il PIN</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
