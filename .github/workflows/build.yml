# Build, test, Linux packages and one release with everything.
#
# Jobs:
#   test     Windows and Ubuntu
#   windows  zip with the exe
#   linux    tar.gz, deb, rpm and AppImage, smoke-tested in Ubuntu, Fedora and the AppImage
#   release  draft release with all the files (version tags only)
#
# The Windows exe is not code-signed (see docs/DEVELOPMENT.md, "Code signing").

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release on tags

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Lss.Tests -c Release

  windows:
    # Steam's registry key on Windows: needs a Windows runner.
    runs-on: windows-latest
    needs: test

    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Tag matches the version
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Lss.App/Lss.App.csproj -getProperty:Version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in the .csproj."
          }

      - name: Test
        run: dotnet test tests/Lss.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Single exe
        run: dotnet publish src/Lss.App/Lss.App.csproj -p:PublishProfile=win-x64 --nologo

      - name: Zip
        shell: pwsh
        run: ./scripts/release.ps1 -SkipTests -Exe bin/publish/win-x64/LSS.exe

      - name: Zip artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lss-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: tests/Lss.Tests/TestResults/*.trx

  linux:
    # ubuntu-22.04: an older glibc, so the packages run on more distributions.
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Version pinned, checked against the checksums published by nfpm.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSL -o "nfpm_${NFPM_VERSION}_amd64.deb" "$base/nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep "nfpm_${NFPM_VERSION}_amd64.deb" checksums.txt | sha256sum -c -
          sudo dpkg -i "nfpm_${NFPM_VERSION}_amd64.deb"

      - name: Packages
        run: bash scripts/release.sh --skip-tests

      - name: "Smoke test: deb on Ubuntu 24.04"
        run: docker run --rm -v "$PWD/dist:/dist" ubuntu:24.04 bash -c "apt-get update -qq && apt-get install -y -qq /dist/lss_*_amd64.deb && lss --version"

      - name: "Smoke test: rpm on Fedora 42"
        run: docker run --rm -v "$PWD/dist:/dist" fedora:42 bash -c "dnf install -y -q /dist/lss-*.x86_64.rpm && lss --version"

      - name: "Smoke test: AppImage"
        run: chmod +x dist/*.AppImage && dist/LSS-*-x86_64.AppImage --appimage-extract-and-run --version

      - name: Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: lss-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  release:
    # Only on version tags: one draft with the Windows and Linux files.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux]

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lss-*
          merge-multiple: true
          path: dist

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body: |
            The files are not code-signed. On Windows, SmartScreen may say "Windows protected your PC": choose *More info → Run anyway*. With Smart App Control on, Windows may refuse to start it (see the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#installation--windows)). Check each file against its `.sha256`.

            What's new is in the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
